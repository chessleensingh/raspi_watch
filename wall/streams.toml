# The four streams, in tile order:
#
#     tile 1 (key "1")   tile 2 (key "2")
#     tile 3 (key "3")   tile 4 (key "4")
#
# Each entry can be any of:
#
#   "https://www.youtube.com/watch?v=VIDEOID"   a specific YouTube live stream
#   "https://www.youtube.com/@dota2/live"       whatever that channel is streaming now
#   "dota2ti"                                   a Twitch channel name
#
# YouTube entries go straight to mpv (which drives yt-dlp). Twitch entries go
# through streamlink.
#
# HEADS UP for YouTube: four concurrent TI streams are usually four separate
# video IDs on the SAME channel, and those IDs change every day of the event.
# The "@channel/live" form only ever resolves to one stream per channel, so it
# cannot give you all four. Run this each morning to get the day's IDs:
#
#     python3 wall/find_streams.py
#
# TI 2026 group stage runs Aug 13-16. Valve had not published the secondary
# channel names as of Aug 10, so these are placeholders - replace them.

streams = [
  "https://www.youtube.com/@dota2/live",
  "",
  "",
  "",
]

# YouTube quality, passed to yt-dlp. Capped at 1080p60 - this Mac is an 8-core
# i9 with VideoToolbox, so four of those is realistic. Drop the height to 720
# if the fans get loud.
ytdl_format = "bestvideo[height<=?1080][fps<=?60]+bestaudio/best[height<=?1080]"

# Twitch quality, tried left to right. Only used for Twitch entries.
quality = "1080p60,720p60,720p,best"

[screen]
# Which display to put the wall on. Auto-detection prefers an EXTERNAL display
# over the MacBook's own panel, which is what you want for the TV/projector.
# Override if it guesses wrong. See your options with:
#
#     python3 wall/wall.py --list-displays
#
# -1 = auto-detect.
index = -1

# Leave at 0 to auto-detect size. Note that Retina panels must be given their
# LOGICAL size (half the advertised pixels) or tiles land off-screen.
width = 0
height = 0
