# The four streams, in tile order:
#
#     tile 1 (key "1")   tile 2 (key "2")
#     tile 3 (key "3")   tile 4 (key "4")
#
# Each entry can be any of:
#
#   "https://www.youtube.com/watch?v=VIDEOID"   a specific YouTube live stream
#   "https://www.youtube.com/@dota2/live"       whatever that channel is streaming now
#   "dota2ti"                                   a Twitch channel name
#
# YouTube entries go straight to mpv (which drives yt-dlp). Twitch entries go
# through streamlink.
#
# Valve's 2026-08-11 announcement ("The International: Streams, Secret Shop,
# and More") named the four English streams on Twitch, and unlike the YouTube
# side those names are STABLE for the whole event. So the wall just uses them,
# and there is no daily video-ID hunt to do.
#
#   Group stage  Aug 13-16      Main event  Aug 20-23
#
# HEADS UP if you switch to YouTube: Valve publishes only a single
# youtube.com/dota2 "All Streams" link, and the four concurrent streams are
# four separate video IDs on that one channel that CHANGE EVERY DAY. The
# "@channel/live" form only resolves to one of them. So on YouTube, and only
# then, run this each morning and paste what it prints:
#
#     python3 wall/find_streams.py

# YOUTUBE IS THE CHOSEN PATH. Twitch injects ads into the stream itself and no
# client can strip them; YouTube through yt-dlp has no ad slot at all. The cost
# is that these IDs change every day of the event, so each morning run:
#
#     python3 wall/find_streams.py
#
# and paste what it prints over the four entries below.
streams = [
  "https://www.youtube.com/watch?v=SYzqkT76GkQ",
  "",
  "",
  "",
]

# The broadcast titles, in the same order. These are what let the
# scoreboard work out which stream a game is on: Valve's payload names
# no stream, but the title names both teams. Printed by find_streams.py.
titles = [
  "[EN-A] Team Falcons vs. Vici Gaming - The International 2026 - Group Stage - Elimination Round",
  "",
  "",
  "",
]

# FALLBACK ONLY - the Twitch names Valve announced on 2026-08-11. These are
# stable for the whole event and need no daily hunt, so they are worth having
# if YouTube fails mid-broadcast. Ads are the reason they are not the default.
#
#   English  dota2ti, dota2ti_2, dota2ti_3, dota2ti_4
#   Chinese  dota2ti_cn, dota2ti_cn_2, dota2ti_cn_3, dota2ti_cn_4
#   Russian  dota2ti_ru, dota2ti_ru_2, dota2ti_ru_3, dota2ti_ru_4
#   Spanish  dota2ti_es, dota2ti_es_2, dota2ti_es_3, dota2ti_es_4

# YouTube quality, passed to yt-dlp. Capped at 1080p60 - this Mac is an 8-core
# i9 with VideoToolbox, so four of those is realistic. Drop the height to 720
# if the fans get loud.
ytdl_format = "bestvideo[height<=?1080][fps<=?60]+bestaudio/best[height<=?1080]"

# Twitch quality, tried left to right. Only used for Twitch entries, which are
# not the intended path here -- Twitch injects ads into the stream itself, and
# streamlink can only skip them by cutting to a lower-quality segment or
# stalling. YouTube via yt-dlp has no such problem. Kept working as a fallback
# in case a broadcast is Twitch-only.
quality = "1080p60,720p60,720p,best"

[screen]
# Which display to put the wall on. Auto-detection prefers an EXTERNAL display
# over the MacBook's own panel, which is what you want for the TV/projector.
# Override if it guesses wrong. See your options with:
#
#     python3 wall/wall.py --list-displays
#
# -1 = auto-detect.
index = -1

# Leave at 0 to auto-detect size. Note that Retina panels must be given their
# LOGICAL size (half the advertised pixels) or tiles land off-screen.
width = 0
height = 0
