# The four streams the viewer shows, in the order it numbers them (keys 1-4).
#
# Each entry can be:
#
#   "https://www.youtube.com/watch?v=VIDEOID"   a specific YouTube live stream
#   "dota2ti"                                   a Twitch channel name
#   ""                                          an empty slot
#
# NOT "youtube.com/@dota2/live": that resolves to a different video every day
# and cannot be embedded at all, so it renders as an empty slot.
#
# Do not edit this by hand -- doing so broke it twice. Run:
#
#     python wall/find_streams.py --write
#
# which picks the four English streams, writes both arrays, and refuses to write
# anything that would not parse. Then press R on the viewer.

streams = [
  "https://www.youtube.com/watch?v=SYzqkT76GkQ",
  "",
  "",
  "",
]

# The broadcast titles, in the same order. These are what let the scoreboard
# work out which stream a game is on: Valve's payload names no stream, but the
# title names both teams. Written by find_streams.py --write.
titles = [
  "[EN-A] Team Falcons vs. Vici Gaming - The International 2026 - Group Stage - Elimination Round",
