<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI Viewer</title>
  <link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
  <!-- All players live in this stack at full size. Only the selected one is
       opaque and on top; the rest keep playing behind it, muted. -->
  <main id="stack" class="stack"></main>

  <div id="label" class="label"></div>

  <!-- Clickable equivalents of the keys. The keyboard needs this window
       focused; a mouse does not, which matters when the viewer is on a screen
       you are not typing at. -->
  <div id="controls" class="controls">
    <button id="btn-mute" class="control" title="Mute / unmute (M)">
      <span id="btn-mute-icon">&#128263;</span><span id="btn-mute-text">Sound off</span>
    </button>
    <button id="btn-live" class="control" title="Jump every stream to the live edge (L)">
      <span>&#9193;</span><span>Sync to live</span>
    </button>
    <button id="btn-reload" class="control" title="Re-read streams.toml (R)">
      <span>&#8635;</span><span>Reload streams</span>
    </button>
  </div>

  <!-- Browsers only allow autoplay when muted, and only a gesture on THIS
       window can unmute. So the picture starts silent and this asks once. -->
  <button id="unmute" class="unmute" hidden>
    <span class="unmute-icon">&#128263;</span>
    <span>Click anywhere to turn on sound</span>
    <small>then audio follows whatever you click on the scoreboard</small>
    <small>1-4 pick a stream &middot; M mute &middot; R reload streams &middot; F fullscreen</small>
  </button>

  <div id="toast" class="toast"></div>

  <noscript>This viewer needs JavaScript.</noscript>
  <script src="/static/viewer.js"></script>
</body>
</html>
